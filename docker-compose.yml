version: '3.8'

services:
  neo4j:
    image: ${DOCKER_REGISTRY:-}neo4j:5.11
    container_name: neo4j_graph
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-Neo4jSecurePass2026!}
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "127.0.0.1:7474:7474" # Neo4j Browser UI bound locally
      - "127.0.0.1:7687:7687" # Bolt Protocol bound locally
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  redis:
    image: ${DOCKER_REGISTRY:-}redis:alpine
    container_name: redis_broker
    command: redis-server --requirepass "${REDIS_PASSWORD:-RedisSecurePass2026!}"
    ports:
      - "127.0.0.1:6379:6379" # Bound locally
    restart: unless-stopped

  api:
    build:
      context: ./backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
        PYPI_MIRROR: ${PYPI_MIRROR:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple}
        PYPI_HOST: ${PYPI_HOST:-pypi.repo.ime.co.ir}
    container_name: graphrag_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./repos:/app/repos:ro # Read-only mount for code repositories sandbox
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-Neo4jSecurePass2026!}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/0
      - API_KEY=${API_KEY:-}
      - ALLOW_UNAUTHENTICATED=${ALLOW_UNAUTHENTICATED:-false}
      - ALLOWED_REPO_DIR=/app/repos
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PIP_INDEX_URL=${PYPI_MIRROR:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple}
      - PIP_TRUSTED_HOST=${PYPI_HOST:-pypi.repo.ime.co.ir}
    depends_on:
      - neo4j
      - redis
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
        PYPI_MIRROR: ${PYPI_MIRROR:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple}
        PYPI_HOST: ${PYPI_HOST:-pypi.repo.ime.co.ir}
    container_name: graphrag_worker
    command: celery -A app.core.celery.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./repos:/app/repos:ro # Read-only sandbox mount
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-Neo4jSecurePass2026!}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/0
      - ALLOWED_REPO_DIR=/app/repos
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PIP_INDEX_URL=${PYPI_MIRROR:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple}
      - PIP_TRUSTED_HOST=${PYPI_HOST:-pypi.repo.ime.co.ir}
    depends_on:
      - neo4j
      - redis
      - api
    restart: unless-stopped

  mcp_server:
    build:
      context: ./backend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
        PYPI_MIRROR: ${PYPI_MIRROR:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple}
        PYPI_HOST: ${PYPI_HOST:-pypi.repo.ime.co.ir}
    container_name: graphrag_mcp
    command: python -m app.mcp_server --transport sse --port 8001 --host 0.0.0.0
    volumes:
      - ./backend:/app
      - ./repos:/app/repos:ro
    ports:
      - "127.0.0.1:8001:8001" # MCP SSE bound locally
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-Neo4jSecurePass2026!}
      - ALLOWED_REPO_DIR=/app/repos
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PIP_INDEX_URL=${PYPI_MIRROR:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple}
      - PIP_TRUSTED_HOST=${PYPI_HOST:-pypi.repo.ime.co.ir}
    depends_on:
      - neo4j
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY:-}
    container_name: graphrag_dashboard
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - api
    restart: unless-stopped

volumes:
  neo4j_data:
