version: "3.8"

# ==============================================================================
# Preflight - Launch Readiness for Apps Built with AI
# Architecture: 2 Services (API & Dashboard)
# Blast Radius Zero: Hardened Sandboxes on preflight_sandbox_net
# Engine: Native Vultr Serverless Inference
# ==============================================================================

services:
  api:
    build:
      context: ./backend
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=localhost,127.0.0.1,host.docker.internal,api,frontend
        - PYPI_MIRROR=${PYPI_MIRROR:-}
        - PYPI_HOST=${PYPI_HOST:-}
    container_name: preflight_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./repos:/app/repos
      - ./frontend:/app/frontend:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      - ALLOWED_REPO_DIR=/app/repos
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - ALLOW_UNAUTHENTICATED=${ALLOW_UNAUTHENTICATED:-false}
      - PREFLIGHT_DB_PATH=/app/data/preflight.db
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.vultrinference.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4.1-flash-1017}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - SANDBOX_DOCKER_NETWORK=preflight_sandbox_net
      - SANDBOX_MEMORY_LIMIT=256m
      - SANDBOX_NANO_CPUS=500000000
      - SANDBOX_PIDS_LIMIT=64
      - SANDBOX_MAX_LIFETIME=120
      - SANDBOX_RUNNER_URL=http://localhost:8000/runner
      - SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN:-change-me-in-production}
      - TRUST_PROXY_HEADERS=true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      preflight_net:
        aliases:
          - api
          - preflight_api
      preflight_sandbox_net: {}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: preflight_dashboard
    ports:
      - "${WEB_PORT:-8001}:80"
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      preflight_net:
        aliases:
          - frontend
          - preflight_dashboard
    restart: unless-stopped

networks:
  preflight_net:
    name: preflight_net
    driver: bridge
  preflight_sandbox_net:
    name: preflight_sandbox_net
    driver: bridge
