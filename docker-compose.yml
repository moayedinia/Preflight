version: "3.8"

# ==============================================================================
# Preflight - Launch Readiness for Apps Built with AI
# Architecture: API, Dashboard, and a private Docker-backed sandbox runner
# Blast Radius Zero: Hardened Sandboxes on preflight_sandbox_net
# Engine: Native Vultr Serverless Inference
# ==============================================================================

services:
  # Bind mounts created by Docker/host deployments are often root-owned.  This
  # one-shot bootstrap gives the non-root API process ownership of only its
  # persistent workspaces; it never grants world-writable permissions.
  repo_permissions:
    build:
      context: ./backend
    user: root
    command: >
      sh -lc 'mkdir -p /app/repos /app/data &&
      chown -R 1000:1000 /app/repos /app/data &&
      chmod -R u+rwX /app/repos /app/data'
    volumes:
      - ./backend/data:/app/data
      - ./repos:/app/repos
    restart: "no"

  api:
    build:
      context: ./backend
      args:
        - HTTP_PROXY=${HTTP_PROXY:-}
        - HTTPS_PROXY=${HTTPS_PROXY:-}
        - NO_PROXY=localhost,127.0.0.1,host.docker.internal,api,frontend
        - PYPI_MIRROR=${PYPI_MIRROR:-}
        - PYPI_HOST=${PYPI_HOST:-}
    container_name: preflight_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
      - ./repos:/app/repos
      - ./frontend:/app/frontend:ro
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      - ALLOWED_REPO_DIR=/app/repos
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - ALLOW_UNAUTHENTICATED=${ALLOW_UNAUTHENTICATED:-false}
      - PREFLIGHT_DB_PATH=/app/data/preflight.db
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.vultrinference.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4.1-flash-1017}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - SANDBOX_DOCKER_NETWORK=preflight_sandbox_net
      - SANDBOX_MEMORY_LIMIT=${SANDBOX_MEMORY_LIMIT:-256m}
      - SANDBOX_NANO_CPUS=${SANDBOX_NANO_CPUS:-500000000}
      - SANDBOX_PIDS_LIMIT=${SANDBOX_PIDS_LIMIT:-64}
      - SANDBOX_MAX_LIFETIME=${SANDBOX_MAX_LIFETIME:-120}
      - SANDBOX_RUNNER_URL=http://sandbox_runner:8010
      - SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN:-change-me-in-production}
      - TRUST_PROXY_HEADERS=true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      repo_permissions:
        condition: service_completed_successfully
    networks:
      preflight_net:
        aliases:
          - api
          - preflight_api
      preflight_sandbox_net: {}
    restart: unless-stopped

  sandbox_runner:
    build:
      context: ./backend
    container_name: preflight_sandbox_runner
    command: uvicorn app.sandbox_runner:app --host 0.0.0.0 --port 8010
    volumes:
      - ./backend:/app
      - ./repos:/app/repos:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      repo_permissions:
        condition: service_completed_successfully
    environment:
      - PYTHONPATH=/app
      - ALLOWED_REPO_DIR=/app/repos
      - SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN:-change-me-in-production}
      - SANDBOX_DOCKER_NETWORK=preflight_sandbox_net
      - SANDBOX_MEMORY_LIMIT=${SANDBOX_MEMORY_LIMIT:-256m}
      - SANDBOX_NANO_CPUS=${SANDBOX_NANO_CPUS:-500000000}
      - SANDBOX_PIDS_LIMIT=${SANDBOX_PIDS_LIMIT:-64}
      - SANDBOX_MAX_LIFETIME=${SANDBOX_MAX_LIFETIME:-120}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
    networks:
      preflight_sandbox_net:
        aliases:
          - sandbox_runner
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: preflight_dashboard
    ports:
      - "${WEB_PORT:-8001}:80"
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      preflight_net:
        aliases:
          - frontend
          - preflight_dashboard
    restart: unless-stopped

networks:
  preflight_net:
    name: preflight_net
    driver: bridge
  preflight_sandbox_net:
    name: preflight_sandbox_net
    driver: bridge
    internal: true
