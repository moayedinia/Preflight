version: '3.8'

services:
  neo4j:
    image: dockerhub.ime.co.ir/neo4j:5.11
    container_name: neo4j_graph
    entrypoint:
      - /bin/bash
      - -c
      - |
        rm -rf /var/lib/neo4j/run/*.pid /data/*.pid /data/run/*.pid 2>/dev/null || true
        if [ -f /startup/docker-entrypoint.sh ]; then
          exec /startup/docker-entrypoint.sh neo4j console
        elif [ -f /docker-entrypoint.sh ]; then
          exec /docker-entrypoint.sh neo4j console
        else
          exec neo4j console
        fi
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-none}
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      - NEO4J_dbms_default__listen__address=0.0.0.0
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    networks:
      codegraph_net:
        aliases:
          - neo4j
          - neo4j_graph
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || curl -f -s http://localhost:7474 || cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-none} 'RETURN 1' || exit 1"]
      interval: 4s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  redis:
    image: dockerhub.ime.co.ir/redis:alpine
    container_name: redis_broker
    command: redis-server --requirepass "${REDIS_PASSWORD:-RedisSecurePass2026!}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecurePass2026!}", "ping"]
      interval: 4s
      timeout: 3s
      retries: 5
    networks:
      codegraph_net:
        aliases:
          - redis
          - redis_broker
    restart: unless-stopped

  api:
    build:
      context: ./backend
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://linux.repo.ime.co.ir/repository/debian}
        PYPI_MIRROR: ${PYPI_MIRROR:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple/}
        PYPI_HOST: ${PYPI_HOST:-pypi.repo.ime.co.ir}
    container_name: graphrag_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./repos:/app/repos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-none}
      - NEO4J_AUTH=${NEO4J_AUTH:-none}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/0
      - API_KEY=${API_KEY:-}
      - ALLOW_UNAUTHENTICATED=${ALLOW_UNAUTHENTICATED:-true}
      - ALLOWED_REPO_DIR=/app/repos
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-jina-embeddings-v2-code:latest}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-768}
      - ALLOW_FAKE_EMBEDDINGS=${ALLOW_FAKE_EMBEDDINGS:-false}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - PIP_INDEX_URL=${PYPI_MIRROR:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple/}
      - PIP_TRUSTED_HOST=${PYPI_HOST:-pypi.repo.ime.co.ir}
      - PIP_DEFAULT_TIMEOUT=180
      - PIP_RETRIES=5
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      codegraph_net:
        aliases:
          - api
          - graphrag_api
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://linux.repo.ime.co.ir/repository/debian}
        PYPI_MIRROR: ${PYPI_MIRROR:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple/}
        PYPI_HOST: ${PYPI_HOST:-pypi.repo.ime.co.ir}
    container_name: graphrag_worker
    command: celery -A app.core.celery.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./repos:/app/repos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-none}
      - NEO4J_AUTH=${NEO4J_AUTH:-none}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-RedisSecurePass2026!}@redis:6379/0
      - ALLOWED_REPO_DIR=/app/repos
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-jina-embeddings-v2-code:latest}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-768}
      - ALLOW_FAKE_EMBEDDINGS=${ALLOW_FAKE_EMBEDDINGS:-false}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - PIP_INDEX_URL=${PYPI_MIRROR:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple/}
      - PIP_TRUSTED_HOST=${PYPI_HOST:-pypi.repo.ime.co.ir}
      - PIP_DEFAULT_TIMEOUT=180
      - PIP_RETRIES=5
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      codegraph_net:
        aliases:
          - celery_worker
          - graphrag_worker
    restart: unless-stopped

  mcp_server:
    build:
      context: ./backend
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://linux.repo.ime.co.ir/repository/debian}
        PYPI_MIRROR: ${PYPI_MIRROR:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple/}
        PYPI_HOST: ${PYPI_HOST:-pypi.repo.ime.co.ir}
    container_name: graphrag_mcp
    command: python -m app.mcp_server --transport sse --port 8002 --host 0.0.0.0
    volumes:
      - ./backend:/app
      - ./repos:/app/repos
    ports:
      - "${MCP_PORT:-8002}:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONIOENCODING=utf-8
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-none}
      - NEO4J_AUTH=${NEO4J_AUTH:-none}
      - ALLOWED_REPO_DIR=/app/repos
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-jina-embeddings-v2-code:latest}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-768}
      - ALLOW_FAKE_EMBEDDINGS=${ALLOW_FAKE_EMBEDDINGS:-false}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - PIP_INDEX_URL=${PYPI_MIRROR:-https://pypi.repo.ime.co.ir/repository/pypi-group/simple/}
      - PIP_TRUSTED_HOST=${PYPI_HOST:-pypi.repo.ime.co.ir}
      - PIP_DEFAULT_TIMEOUT=180
      - PIP_RETRIES=5
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      codegraph_net:
        aliases:
          - mcp_server
          - graphrag_mcp
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: graphrag_dashboard
    ports:
      - "${WEB_PORT:-8001}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      codegraph_net:
        aliases:
          - frontend
          - graphrag_dashboard
    restart: unless-stopped

networks:
  codegraph_net:
    name: codegraph_net
    driver: bridge

volumes:
  neo4j_data:
