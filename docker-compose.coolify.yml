# ==============================================================================
# Vultr Coolify Marketplace Production Stack
# Reference: https://docs.vultr.com/how-to-deploy-an-application-with-vultr-coolify-marketplace-app
# Optimized for 1-Click Deployment on Vultr Cloud Compute with Coolify
# Integrates Vultr Serverless Inference & Vultr Supabase Marketplace App
# ==============================================================================

version: "3.8"

services:
  neo4j:
    image: neo4j:5.11
    container_name: coolify_neo4j_graph
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-none}
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      - NEO4J_dbms_default__listen__address=0.0.0.0
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
    volumes:
      - neo4j_coolify_data:/data
    networks:
      - coolify_codegraph_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: coolify_redis_broker
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-CoolifyRedisSecure2026!}"
    volumes:
      - redis_coolify_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CoolifyRedisSecure2026!}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - coolify_codegraph_net
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coolify_graphrag_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - repo_coolify_data:/app/repos
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-none}
      - NEO4J_AUTH=${NEO4J_AUTH:-none}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-CoolifyRedisSecure2026!}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-CoolifyRedisSecure2026!}@redis:6379/0
      - ALLOWED_REPO_DIR=/app/repos
      - ALLOW_UNAUTHENTICATED=${ALLOW_UNAUTHENTICATED:-true}
      - ALLOWED_ORIGINS=*
      # Vultr Serverless Inference Native Integration
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.vultrinference.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4.1-flash-1017}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # Vultr Supabase Marketplace Integration
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      # Vultr Agent Sandboxing Runner
      - SANDBOX_RUNNER_URL=http://sandbox_runner:8010
      - SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN:-vultr-sandbox-coolify-token}
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox_runner:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify_codegraph_net
    restart: unless-stopped

  sandbox_runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coolify_sandbox_runner
    command: uvicorn app.sandbox_runner:app --host 0.0.0.0 --port 8010
    user: root
    volumes:
      - repo_coolify_data:/app/repos:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONPATH=/app
      - ALLOWED_REPO_DIR=/app/repos
      - SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN:-vultr-sandbox-coolify-token}
      - SANDBOX_DOCKER_NETWORK=coolify_sandbox_net
      # Vultr Cloud Compute Agent Sandboxing Standards
      - SANDBOX_MEMORY_LIMIT=${SANDBOX_MEMORY_LIMIT:-1g}
      - SANDBOX_NANO_CPUS=${SANDBOX_NANO_CPUS:-1000000000}
      - SANDBOX_PIDS_LIMIT=${SANDBOX_PIDS_LIMIT:-100}
    networks:
      - coolify_codegraph_net
      - coolify_sandbox_net
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coolify_graphrag_worker
    command: celery -A app.core.celery.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - repo_coolify_data:/app/repos
    environment:
      - PYTHONPATH=/app
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-none}
      - NEO4J_AUTH=${NEO4J_AUTH:-none}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-CoolifyRedisSecure2026!}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-CoolifyRedisSecure2026!}@redis:6379/0
      - ALLOWED_REPO_DIR=/app/repos
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.vultrinference.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4.1-flash-1017}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - coolify_codegraph_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coolify_graphrag_frontend
    depends_on:
      api:
        condition: service_healthy
    networks:
      - coolify_codegraph_net
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${COOLIFY_FQDN:-localhost}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    ports:
      - "${COOLIFY_WEB_PORT:-80}:80"
    restart: unless-stopped

networks:
  coolify_codegraph_net:
    name: coolify_codegraph_net
    driver: bridge
  coolify_sandbox_net:
    name: coolify_sandbox_net
    driver: bridge

volumes:
  neo4j_coolify_data:
  redis_coolify_data:
  repo_coolify_data:
