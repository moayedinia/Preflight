# ==============================================================================
# Vultr Coolify Marketplace Production Stack - Preflight
# Optimized for 1-Click Deployment on Vultr Cloud Compute with Coolify
# Architecture: 2 Services (API & Dashboard)
# Native Vultr Serverless Inference & Hardened Containment Sandboxes
# ==============================================================================

version: "3.8"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coolify_preflight_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - repo_coolify_data:/app/repos
      - auth_coolify_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PREFLIGHT_DB_PATH=/app/data/preflight.db
      - COOKIE_SECURE=true
      - ALLOWED_REPO_DIR=/app/repos
      - ALLOW_UNAUTHENTICATED=${ALLOW_UNAUTHENTICATED:-false}
      - ALLOWED_ORIGINS=*
      # Vultr Serverless Inference Native Integration
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.vultrinference.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4.1-flash-1017}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # Hardened Sandboxing on Vultr Cloud Compute
      - SANDBOX_DOCKER_NETWORK=preflight_sandbox_net
      - SANDBOX_MEMORY_LIMIT=256m
      - SANDBOX_NANO_CPUS=500000000
      - SANDBOX_PIDS_LIMIT=64
      - SANDBOX_MAX_LIFETIME=120
      - SANDBOX_RUNNER_URL=http://localhost:8000/runner
      - SANDBOX_RUNNER_TOKEN=${SANDBOX_RUNNER_TOKEN:-vultr-sandbox-coolify-token}
      - TRUST_PROXY_HEADERS=true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coolify_preflight_net
      - preflight_sandbox_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coolify_preflight_dashboard
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - coolify_preflight_net
    restart: unless-stopped

networks:
  coolify_preflight_net:
    name: coolify_preflight_net
    driver: bridge
  preflight_sandbox_net:
    name: preflight_sandbox_net
    driver: bridge

volumes:
  repo_coolify_data:
  auth_coolify_data:
